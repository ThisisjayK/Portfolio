<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- Cover art for the case-studies gallery. Two-ink riso card in the site's
       palette: this is the light-theme variant (pink paper, green ink). The
       pink-ink twin is cover-pink.svg and must stay geometrically identical.
       Web fonts do not load inside an SVG rasterised as an <img>, so every
       type element here names system families only. -->
  <defs>
    <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" fill="#00663a" />
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#ffccfd" />
  <rect width="800" height="1000" fill="url(#halftone)" opacity=".13" />
  <rect x="38" y="38" width="724" height="924" fill="none" stroke="#00663a" stroke-opacity=".3" />

  <g fill="#00663a" font-family="'Courier New',Courier,monospace" font-size="23" letter-spacing="2.6">
    <text x="76" y="112">STAGE ZERO HEALTH</text>
  </g>
  <line x1="76" y1="136" x2="724" y2="136" stroke="#00663a" stroke-opacity=".3" />

  <g fill="#00663a" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="70" letter-spacing="-2.6">
    <text x="74" y="242">Screening the</text>
    <text x="74" y="312">women the</text>
    <text x="74" y="382">guidelines miss</text>
  </g>

  <!-- Age axis. 20 to 80 maps linearly across x 110 to 690. The shaded band is
       the USPSTF 40 to 74 mammography window; the ringed point at 32 is the
       woman with a first-degree family history who sits outside it. -->
  <g>
    <rect x="303" y="516" width="329" height="86" fill="#00663a" opacity=".17" />
    <line x1="110" y1="559" x2="690" y2="559" stroke="#00663a" stroke-width="2" />

    <g stroke="#00663a" stroke-width="2">
      <line x1="110" y1="551" x2="110" y2="567" />
      <line x1="303" y1="509" x2="303" y2="609" />
      <line x1="632" y1="509" x2="632" y2="609" />
      <line x1="690" y1="551" x2="690" y2="567" />
    </g>

    <g fill="#00663a" font-family="'Courier New',Courier,monospace" font-size="21" letter-spacing="1">
      <text x="103" y="642">20</text>
      <text x="296" y="642">40</text>
      <text x="625" y="642">74</text>
      <text x="392" y="571" font-size="18" letter-spacing="2.2">COVERED</text>
    </g>

    <line x1="226" y1="452" x2="226" y2="537" stroke="#00663a" stroke-width="1.6" stroke-dasharray="5 5" />
    <circle cx="226" cy="559" r="13" fill="#ffccfd" stroke="#00663a" stroke-width="3" />
    <circle cx="226" cy="559" r="4.5" fill="#00663a" />
    <g fill="#00663a" font-family="'Courier New',Courier,monospace" font-size="21" letter-spacing="1.4">
      <text x="196" y="440">AGE 32</text>
      <text x="150" y="418" font-size="17" letter-spacing="0.6">MOTHER DIAGNOSED AT 45</text>
    </g>
  </g>

  <line x1="76" y1="712" x2="724" y2="712" stroke="#00663a" stroke-opacity=".3" />

  <g fill="#00663a">
    <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="52" letter-spacing="-2">
      <text x="76" y="794">40–74</text>
      <text x="330" y="794">6</text>
      <text x="530" y="794">313</text>
    </g>
    <g font-family="'Courier New',Courier,monospace" font-size="17" letter-spacing="1" opacity=".92">
      <text x="76" y="822">USPSTF WINDOW</text>
      <text x="330" y="822">GAIL FACTORS</text>
      <text x="530" y="822">SNPs IN BOADICEA</text>
    </g>
  </g>

  <line x1="76" y1="874" x2="724" y2="874" stroke="#00663a" stroke-opacity=".3" />
  <g fill="#00663a" font-family="'Courier New',Courier,monospace" font-size="18" letter-spacing="1.2" opacity=".95">
    <text x="76" y="912">PROBLEM / SOLUTION / IMPACT</text>
    <text x="76" y="936">TECHNICAL PM INTERN · 5 MONTHS</text>
  </g>
</svg>

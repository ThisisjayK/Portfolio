<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- Placeholder card for the case-studies gallery, dark-theme variant (green
       paper, pink ink). Kept deliberately quieter than a real cover: dashed
       rule, no data, no headline, so it reads as an empty slot rather than a
       case study whose text failed to load. The green-ink twin is
       soon-card-green.svg and must stay geometrically identical. Web fonts do
       not load inside an SVG rasterised as an <img>, so system families only. -->
  <defs>
    <pattern id="halftone-soon-p" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" fill="#ffccfd" />
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#00663a" />
  <rect width="800" height="1000" fill="url(#halftone-soon-p)" opacity=".13" />
  <rect x="38" y="38" width="724" height="924" fill="none" stroke="#ffccfd"
        stroke-opacity=".34" stroke-dasharray="10 8" />

  <g fill="#ffccfd" font-family="'Courier New',Courier,monospace" font-size="23" letter-spacing="2.6" opacity=".72">
    <text x="76" y="112">CASE STUDY</text>
  </g>
  <line x1="76" y1="136" x2="724" y2="136" stroke="#ffccfd" stroke-opacity=".3" />

  <!-- One frozen frame of the site's pixel-frog mascot (sleeping pose, frame 0
       of sleeping_sheet_transparent.png) - a napping frog for a slot with
       nothing to show yet. Native 28x32, kept in its own colours rather than
       remapped to the card's ink, matching how the mascot looks everywhere
       else on the site. Centred above the "Coming soon" line as one group. -->
  <image
    x="300" y="286" width="200" height="229"
    style="image-rendering: pixelated"
    href="data:image/png;base64,"
  />
  <g fill="#ffccfd" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="70" letter-spacing="-2.6" opacity=".62" text-anchor="middle">
    <text x="400" y="618">Coming</text>
    <text x="400" y="688">soon</text>
  </g>

  <line x1="76" y1="874" x2="724" y2="874" stroke="#ffccfd" stroke-opacity=".3" />
  <g fill="#ffccfd" font-family="'Courier New',Courier,monospace" font-size="18" letter-spacing="1.2" opacity=".62">
    <text x="76" y="912">WRITE-UP IN PROGRESS</text>
  </g>
</svg>

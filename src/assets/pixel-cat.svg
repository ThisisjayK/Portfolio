<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 13"
     shape-rendering="crispEdges" role="img" aria-label="Pixel-art cat mascot">
  <!-- 8-bit mascot on a 16x13 block grid. One SVG unit = one pixel block, so it
       stays hard-edged at any size. Colours are overridable: set --cat-body and
       --cat-eye to theme it. The grid it was drawn from, for future edits:

     ..BB........BB..
     ..BBB......BBB..
     ..BBBBBBBBBBBB..
     ..BBKKBBBBKKBB..
     ..BBKKBBBBKKBB..
     ..BBBBBKKBBBBB..
     ..BBBBBBBBBBBB..
     ...BBBBBBBBBB.BB
     ...BBBBBBBBBB.B.
     ...BBBBBBBBBB.B.
     ...BBBBBBBBBBBB.
     ....B.B..B.B....
     ....B.B..B.B....
  -->
  <g fill="var(--cat-body, #C8795C)">
    <rect x="2" y="0" width="2" height="1" />
    <rect x="12" y="0" width="2" height="1" />
    <rect x="2" y="1" width="3" height="1" />
    <rect x="11" y="1" width="3" height="1" />
    <rect x="2" y="2" width="12" height="1" />
    <rect x="2" y="3" width="2" height="2" />
    <rect x="6" y="3" width="4" height="2" />
    <rect x="12" y="3" width="2" height="2" />
    <rect x="2" y="5" width="5" height="1" />
    <rect x="9" y="5" width="5" height="1" />
    <rect x="2" y="6" width="12" height="1" />
    <rect x="3" y="7" width="10" height="3" />
    <rect x="14" y="7" width="2" height="1" />
    <rect x="14" y="8" width="1" height="2" />
    <rect x="3" y="10" width="12" height="1" />
    <rect x="4" y="11" width="1" height="2" />
    <rect x="6" y="11" width="1" height="2" />
    <rect x="9" y="11" width="1" height="2" />
    <rect x="11" y="11" width="1" height="2" />
  </g>
  <g fill="var(--cat-eye, #17140F)">
    <rect x="4" y="3" width="2" height="2" />
    <rect x="10" y="3" width="2" height="2" />
    <rect x="7" y="5" width="2" height="1" />
  </g>
</svg>

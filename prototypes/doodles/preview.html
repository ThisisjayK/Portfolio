<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doodle animations</title>
<style>
  body { margin: 0; padding: 24px; background: #f0f0f0; color: #111; font: 14px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; text-transform: uppercase; }
  p { margin: 0 0 20px; color: #555; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
  .card { border: 2px solid #111; border-radius: 14px; overflow: hidden; }
  .card h2 { margin: 0; padding: 8px 12px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid #111; }
  .row { display: grid; grid-template-columns: 1fr 1fr; }
  figure { margin: 0; padding: 10px; text-align: center; }
  figure.dark { background: #1d1d1d; color: #ccc; }
  figure img { width: 128px; height: 128px; display: block; margin: 0 auto 6px; }
  figcaption { font-size: 12px; }
</style>
</head>
<body>
<h1>Doodle animations</h1>
<p>Animated WebP (left of each pair) has smooth edges; GIF (right) has hard edges. Each shown on light and dark.</p>
<div class="grid" id="grid"></div>
<script>
  const names = ["cannon", "plant", "controller", "dog", "football", "ramen", "owl", "sneaker"];
  const grid = document.getElementById("grid");
  for (const n of names) {
    const card = document.createElement("section");
    card.className = "card";
    card.innerHTML = `<h2>${n}</h2>
      <div class="row">
        <figure><img src="out/${n}.webp" alt=""><figcaption>WebP</figcaption></figure>
        <figure><img src="out/${n}.gif" alt=""><figcaption>GIF</figcaption></figure>
        <figure class="dark"><img src="out/${n}.webp" alt=""><figcaption>WebP</figcaption></figure>
        <figure class="dark"><img src="out/${n}.gif" alt=""><figcaption>GIF</figcaption></figure>
      </div>`;
    grid.appendChild(card);
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jay · Product Manager portfolio</title>
<meta name="description" content="Early-career product manager. Case studies, product teardowns, and the way I work: run the task first, tie every claim to evidence, name the counter-metric up front." />
<meta name="theme-color" content="#00663a" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
<script>
  // Set the theme before first paint so there is no flash of the wrong colours.
  // Dark is the default: the site is a two-ink print job designed green-first,
  // so a visitor arriving on a light-mode OS should still land on the intended
  // version rather than the inverted one. prefers-color-scheme is deliberately
  // not consulted; only an explicit choice via the toggle switches to light.
  (function () {
    try {
      var t = localStorage.getItem("teardowns-theme");
      document.documentElement.setAttribute(
        "data-theme",
        t === "light" ? "light" : "dark"
      );
    } catch (e) {}
  })();
  // Same again for the reader text size, so the page does not reflow a beat
  // after load. Large is the default; "default" is the old id for what is now
  // "sm", mapped across so an earlier choice survives the rename.
  (function () {
    try {
      var s = localStorage.getItem("teardowns-text-size");
      if (s === "default") s = "sm";
      document.documentElement.setAttribute(
        "data-text",
        s === "sm" || s === "lg" || s === "xl" ? s : "lg"
      );
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
